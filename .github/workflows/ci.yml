name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 前端产物会被 go:embed 打进二进制，Go 检查前必须先构建；
      # build 脚本含 vue-tsc 类型检查
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未 gofmt：$unformatted"
            exit 1
          fi

      - name: go vet (linux / windows / darwin)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin CGO_ENABLED=0 go vet ./...

      - name: go test
        run: go test -race ./...
