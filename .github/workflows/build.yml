name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag and application versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH, got: $GITHUB_REF_NAME"
            exit 1
          fi

          wails_version="$(sed -nE 's/^[[:space:]]*"productVersion":[[:space:]]*"([^"]+)".*/\1/p' wails.json)"
          frontend_version="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' frontend/package.json | head -1)"
          app_version="$(sed -nE 's/^const appVersion = "([^"]+)"/\1/p' updater.go)"

          for value in "$wails_version" "$frontend_version" "$app_version"; do
            if [ "$value" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match project versions: wails=$wails_version frontend=$frontend_version app=$app_version"
              exit 1
            fi
          done

  build-macos:
    needs: verify-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Detect macOS signing readiness
        id: macos_signing
        shell: bash
        env:
          APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          missing=0
          for key in APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 APPLE_DEVELOPER_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_SIGNING_IDENTITY; do
            if [ -z "${!key}" ]; then
              echo "::warning::Missing secret: $key"
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Building unsigned macOS artifact (ad-hoc sign only). Users will need manual security override."
          fi

      - name: Install gon (for macOS notarization)
        if: steps.macos_signing.outputs.enabled == 'true'
        run: brew install Bearer/tap/gon

      - name: Import macOS code-signing certificate
        if: steps.macos_signing.outputs.enabled == 'true'
        uses: Apple-Actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build for macOS (amd64)
        run: wails build -platform darwin/amd64

      - name: List build output
        run: ls -la build/bin/

      - name: Prepare macOS amd64 artifact
        shell: bash
        env:
          SIGNING_ENABLED: ${{ steps.macos_signing.outputs.enabled }}
          MACOS_BUNDLE_ID: ${{ vars.MACOS_BUNDLE_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          cd build/bin
          APP_NAME=$(ls -d *.app | head -1)
          echo "Found app: $APP_NAME"
          BUNDLE_ID="${MACOS_BUNDLE_ID:-com.carefree.claude-env-switcher}"
          INFO_PLIST="$APP_NAME/Contents/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$INFO_PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" "$INFO_PLIST"

          if [ "$SIGNING_ENABLED" = "true" ]; then
            printf '{\n  "source": ["./%s"],\n  "bundle_id": "%s",\n  "apple_id": {\n    "username": "%s",\n    "password": "%s",\n    "provider": "%s"\n  },\n  "sign": {\n    "application_identity": "%s"\n  }\n}\n' \
              "$APP_NAME" "$BUNDLE_ID" "$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID" "$APPLE_SIGNING_IDENTITY" > gon-sign.json
            gon -log-level=info ./gon-sign.json
            rm -f ./gon-sign.json
          else
            codesign --force --deep --sign - "$APP_NAME"
            echo "::warning::amd64 artifact is not notarized. End users must manually allow opening in macOS."
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "claude-env-switcher-macos-amd64.zip"

      - name: Build for macOS (arm64)
        run: |
          # Clean previous build
          rm -rf build/bin/*.app
          wails build -platform darwin/arm64

      - name: Prepare macOS arm64 artifact
        shell: bash
        env:
          SIGNING_ENABLED: ${{ steps.macos_signing.outputs.enabled }}
          MACOS_BUNDLE_ID: ${{ vars.MACOS_BUNDLE_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          cd build/bin
          APP_NAME=$(ls -d *.app | head -1)
          echo "Found app: $APP_NAME"
          BUNDLE_ID="${MACOS_BUNDLE_ID:-com.carefree.claude-env-switcher}"
          INFO_PLIST="$APP_NAME/Contents/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$INFO_PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" "$INFO_PLIST"

          if [ "$SIGNING_ENABLED" = "true" ]; then
            printf '{\n  "source": ["./%s"],\n  "bundle_id": "%s",\n  "apple_id": {\n    "username": "%s",\n    "password": "%s",\n    "provider": "%s"\n  },\n  "sign": {\n    "application_identity": "%s"\n  }\n}\n' \
              "$APP_NAME" "$BUNDLE_ID" "$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID" "$APPLE_SIGNING_IDENTITY" > gon-sign.json
            gon -log-level=info ./gon-sign.json
            rm -f ./gon-sign.json
          else
            codesign --force --deep --sign - "$APP_NAME"
            echo "::warning::arm64 artifact is not notarized. End users must manually allow opening in macOS."
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "claude-env-switcher-macos-arm64.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            build/bin/claude-env-switcher-macos-amd64.zip
            build/bin/claude-env-switcher-macos-arm64.zip
          if-no-files-found: error

  build-windows:
    needs: verify-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows installer (amd64)
        run: wails build -clean -platform windows/amd64 -nsis -webview2 download

      - name: List build output
        run: dir build\bin\

      - name: Prepare Windows installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "build/bin" -Filter "*-amd64-installer.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Wails did not generate the amd64 NSIS installer"
          }

          $artifact = Join-Path $installer.DirectoryName "claude-env-switcher-windows-amd64-installer.exe"
          if ($installer.FullName -ne $artifact) {
            Move-Item -LiteralPath $installer.FullName -Destination $artifact -Force
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $artifact

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: build/bin/claude-env-switcher-windows-amd64-installer.exe
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/macos-builds/claude-env-switcher-macos-amd64.zip
            artifacts/macos-builds/claude-env-switcher-macos-arm64.zip
            artifacts/windows-builds/claude-env-switcher-windows-amd64-installer.exe
          generate_release_notes: true
          draft: false
          prerelease: false
